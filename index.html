<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Защищенный Фото Портала</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="login-container" class="container">
        <div class="login-form">
            <h1>🔒 Фото Портала</h1>
            <form id="login-form">
                <div class="form-group">
                    <label for="username">Имя пользователя:</label>
                    <input type="text" id="username" required>
                </div>
                <div class="form-group">
                    <label for="password">Пароль:</label>
                    <input type="password" id="password" required>
                </div>
                <button type="submit">Войти</button>
            </form>
            <div id="login-error" class="error-message"></div>
        </div>
    </div>

    <div id="main-container" class="container hidden">
        <header>
            <h1>📸 Фото Портала</h1>
            <button id="logout-btn" class="logout-btn">Выйти</button>
        </header>

        <div class="controls">
            <button id="camera-btn" class="btn primary">📷 Открыть камеру</button>
            <button id="gallery-btn" class="btn secondary">🖼️ Галерея</button>
        </div>

        <div id="camera-section" class="section hidden">
            <div class="camera-container">
                <video id="video" autoplay></video>
                <canvas id="canvas" style="display: none;"></canvas>
                <div class="camera-controls">
                    <button id="capture-btn" class="btn capture">📸 Сделать фото</button>
                    <button id="close-camera-btn" class="btn secondary">❌ Закрыть камеру</button>
                </div>
            </div>
        </div>

        <div id="gallery-section" class="section hidden">
            <h2>Галерея фотографий</h2>
            <div id="photo-grid" class="photo-grid">
                <!-- Фотографии будут загружаться здесь -->
            </div>
        </div>

        <div id="preview-section" class="section hidden">
            <h2>Предварительный просмотр</h2>
            <div class="preview-container">
                <img id="preview-image" alt="Предварительный просмотр">
                <div class="preview-controls">
                    <button id="edit-btn" class="btn primary">✏️ Редактировать</button>
                    <button id="save-btn" class="btn primary">💾 Сохранить</button>
                    <button id="retake-btn" class="btn secondary">🔄 Переснять</button>
                </div>
            </div>
        </div>

        <div id="editor-section" class="section hidden">
            <h2>Редактор фотографий</h2>
            <div class="editor-container">
                <div class="editor-tools">
                    <div class="tool-group">
                        <label>Инструменты:</label>
                        <button id="draw-tool" class="tool-btn active" data-tool="draw">✏️ Рисовать</button>
                        <button id="arrow-tool" class="tool-btn" data-tool="arrow">➡️ Стрелка</button>
                        <button id="text-tool" class="tool-btn" data-tool="text">📝 Текст</button>
                        <button id="eraser-tool" class="tool-btn" data-tool="eraser">🧹 Ластик</button>
                    </div>
                    <div class="tool-group">
                        <label>Цвет:</label>
                        <input type="color" id="color-picker" value="#ff0000">
                        <input type="range" id="brush-size" min="1" max="20" value="3">
                        <span id="brush-size-label">3px</span>
                    </div>
                    <div class="tool-group">
                        <button id="undo-btn" class="btn secondary">↶ Отменить</button>
                        <button id="redo-btn" class="btn secondary">↷ Повторить</button>
                        <button id="clear-btn" class="btn secondary">🗑️ Очистить</button>
                    </div>
                </div>
                <div class="editor-canvas-container">
                    <canvas id="editor-canvas"></canvas>
                </div>
                <div class="editor-controls">
                    <button id="save-edited-btn" class="btn primary">💾 Сохранить изменения</button>
                    <button id="cancel-edit-btn" class="btn secondary">❌ Отменить редактирование</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
